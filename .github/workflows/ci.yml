name: CI

on:
  push:
    branches:
      - master
  pull_request:

concurrency:
  group: ${{ github.workflow_ref }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: lint
    uses: bitcart/bitcart-actions/.github/workflows/lint.yml@master
    with:
      install-dependencies: |
        uv sync --frozen --compile-bytecode

  zizmor:
    name: zizmor
    uses: bitcart/bitcart-actions/.github/workflows/zizmor-audit.yml@master
    permissions:
      contents: read
      security-events: write # needed for github advanced security

  test:
    name: test
    uses: bitcart/bitcart-actions/.github/workflows/python-tests.yml@master
    needs: [lint, zizmor]

    permissions:
      contents: read
      id-token: write # OIDC token for codecov uploads

    with:
      python-versions: '["3.11", "3.12", "3.13", "3.14", "3.14t", "3.15", "3.15t"]'

  combine-coverage:
    name: combine-coverage
    uses: bitcart/bitcart-actions/.github/workflows/combine-coverage.yml@master
    needs: test
    if: ${{ !cancelled() }}
